<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT320i HVAC Thermometer</title>
  <link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
  <header class="topbar">
    <h1>UT320i</h1>
    <div class="unit-toggle" id="unitToggle">
      <button data-unit="F">°F</button><button data-unit="C">°C</button>
    </div>
  </header>

  <section id="unsupported" class="banner hidden">
    This browser can't do Bluetooth. Use Chrome on Android/desktop, or Bluefy on iPhone.
  </section>

  <section class="controls">
    <button id="connect" class="big">＋ Add clamp</button>
    <span id="status" class="status"></span>
  </section>

  <section id="clamps" class="cards"></section>

  <section class="panel hidden" id="deltaPanel">
    <h2>ΔT <span class="hint" id="deltaHint"></span></h2>
    <div id="delta" class="reading"></div>
  </section>

  <section class="panel" id="shscPanel">
    <h2>Superheat / Subcool
      <select id="refrigerant" class="inline"></select>
    </h2>
    <div class="shsc-grid">
      <div class="shsc-box">
        <h3>Superheat <span class="hint">suction line</span></h3>
        <div class="shsc-inputs">
          <label>low side <input type="number" id="shPsig" inputmode="decimal" min="0" step="0.5"> psig</label>
          <label>clamp <select id="shClamp"></select></label>
        </div>
        <div class="shsc-out" id="shOut">–</div>
        <div class="hint" id="shDetail"></div>
      </div>
      <div class="shsc-box">
        <h3>Subcool <span class="hint">liquid line</span></h3>
        <div class="shsc-inputs">
          <label>high side <input type="number" id="scPsig" inputmode="decimal" min="0" step="0.5"> psig</label>
          <label>clamp <select id="scClamp"></select></label>
        </div>
        <div class="shsc-out" id="scOut">–</div>
        <div class="hint" id="scDetail"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Trend <span class="hint">last 10 minutes</span></h2>
    <canvas id="chart" class="chart tall"></canvas>
  </section>

  <details class="panel" id="debugPanel">
    <summary>Debug</summary>
    <p class="hint">Troubleshooting tools — use the copy buttons to paste into a bug report.
      Build <code id="build">__BUILD__</code>.</p>
    <div class="stats-row">
      <button id="copyDiag" class="small">Copy diagnostics</button>
      <button id="dumpGatt" class="small">Dump GATT services</button>
      <label class="checkbox"><input type="checkbox" id="showRaw"> Log raw notifications</label>
    </div>
    <div class="stats-row">
      <button id="exportReadings" class="small">Download readings CSV</button>
      <button id="copyReadings" class="small">Copy readings CSV</button>
      <button id="exportCsv" class="small">Download raw frames CSV</button>
      <button id="resetSession" class="small">Reset session</button>
    </div>
    <div id="services" class="services"></div>
    <div class="write-row">
      <select id="presets"><option value="">— preset —</option></select>
      <select id="writeTarget"></select>
      <input type="text" id="writeHex" placeholder="hex bytes, space separated">
      <button id="writeBtn" disabled>Write</button>
    </div>
    <div id="log" class="log"></div>
  </details>

  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
