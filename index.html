<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT320i HVAC Thermometer</title>
  <link rel="stylesheet" href="style.css?v=d71adf4">
</head>
<body>
  <header class="topbar">
    <h1>UT320i</h1>
    <div class="unit-toggle" id="unitToggle">
      <button data-unit="F">°F</button><button data-unit="C">°C</button>
    </div>
  </header>

  <section id="unsupported" class="banner hidden">
    This browser can't do Bluetooth. Use Chrome on Android/desktop, or Bluefy on iPhone.
  </section>

  <section class="controls">
    <button id="connect" class="big">＋ Add clamp</button>
    <span id="status" class="status"></span>
  </section>

  <section id="clamps" class="cards"></section>

  <section class="panel hidden" id="deltaPanel">
    <h2>ΔT <span class="hint" id="deltaHint"></span></h2>
    <div id="delta" class="reading"></div>
  </section>

  <section class="panel" id="shscPanel">
    <h2>Superheat / Subcool
      <select id="refrigerant" class="inline"></select>
    </h2>
    <div class="shsc-grid">
      <div class="shsc-box">
        <h3>Superheat <span class="hint">suction line</span></h3>
        <div class="shsc-inputs">
          <label>low side <input type="number" id="shPsig" inputmode="decimal" min="0" step="0.5"> psig</label>
          <label>clamp <select id="shClamp"></select></label>
        </div>
        <div class="shsc-out" id="shOut">–</div>
        <div class="hint" id="shDetail"></div>
      </div>
      <div class="shsc-box">
        <h3>Subcool <span class="hint">liquid line</span></h3>
        <div class="shsc-inputs">
          <label>high side <input type="number" id="scPsig" inputmode="decimal" min="0" step="0.5"> psig</label>
          <label>clamp <select id="scClamp"></select></label>
        </div>
        <div class="shsc-out" id="scOut">–</div>
        <div class="hint" id="scDetail"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Trend <span class="hint">last 10 minutes</span></h2>
    <canvas id="chart" class="chart"></canvas>
  </section>

  <details class="panel" id="debugPanel">
    <summary>Debug</summary>
    <p class="hint">Build <code id="build">d71adf4</code>. Something wrong?
      Tap copy and paste it into a bug report.</p>
    <button id="copyDiag" class="small">Copy diagnostics</button>
  </details>

  <script src="app.js?v=d71adf4"></script>
</body>
</html>
